services:
  - type: web
    name: haven-engine
    runtime: python
    plan: free
    rootDir: haven-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: DATA_DIR
        value: ./data
      - key: FRONTEND_ORIGIN
        value: https://zayaiken21.github.io
      - key: CORS_ORIGINS
        value: https://zayaiken21.github.io
