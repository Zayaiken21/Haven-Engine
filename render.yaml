services:
  - type: web
    name: the-haven-engine
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: CORS_ORIGINS
        value: "*"
      - key: GITHUB_BACKUP_ENABLED
        value: "false"
